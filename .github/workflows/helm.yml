name: Helm chart

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["helm/**", ".github/workflows/helm.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint helm --strict

      - name: Render with defaults and with OIDC
        run: |
          helm template twentysix-cubed helm > /dev/null
          helm template twentysix-cubed helm --set oidc.enabled=true --set ingress.enabled=true > /dev/null

  publish:
    # Releases only: tag v1.2.3 publishes chart 1.2.3 with appVersion 1.2.3,
    # which points at the Docker images built for the same tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package helm --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
